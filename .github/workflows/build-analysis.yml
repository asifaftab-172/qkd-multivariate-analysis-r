name: Build QKD analysis and report

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/processed/**'
      - 'figures/**'
      - 'results/**'
      - 'submission/**'
      - 'report/report.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check analysis dependencies
        run: |
          Rscript -e 'needed <- setdiff(c("MASS", "cluster"), rownames(installed.packages())); if (length(needed)) install.packages(needed, repos = "https://cloud.r-project.org"); stopifnot(requireNamespace("MASS", quietly = TRUE), requireNamespace("cluster", quietly = TRUE))'

      - name: Run multivariate analysis
        run: Rscript "analysis/M5Assign 5.1 Data__Ronggon_Asif.R"

      - name: Compile LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report.tex
          working_directory: report

      - name: Assemble Moodle submission files
        run: |
          mkdir -p submission
          cp "analysis/M5Assign 5.1 Data__Ronggon_Asif.R" "submission/M5Assign 5.1 Data__Ronggon_Asif.R"
          cp data/processed/QKD_Coexistence_0km_Combined.csv "submission/M5Assign 5.1 Data__Ronggon_Asif.csv"
          cp report/report.pdf "submission/M5Assign 5.1 Report__Ronggon_Asif.pdf"
          test -s "submission/M5Assign 5.1 Data__Ronggon_Asif.R"
          test -s "submission/M5Assign 5.1 Data__Ronggon_Asif.csv"
          test -s "submission/M5Assign 5.1 Report__Ronggon_Asif.pdf"

      - name: Verify standalone submitted script and dataset
        run: |
          verify_dir=$(mktemp -d)
          cp "submission/M5Assign 5.1 Data__Ronggon_Asif.R" "$verify_dir/"
          cp "submission/M5Assign 5.1 Data__Ronggon_Asif.csv" "$verify_dir/"
          (cd "$verify_dir" && Rscript "M5Assign 5.1 Data__Ronggon_Asif.R")
          cmp results/pca_variance.csv "$verify_dir/results/pca_variance.csv"
          cmp results/lda_confusion_matrix.csv "$verify_dir/results/lda_confusion_matrix.csv"

      - name: Save downloadable analysis and submission
        uses: actions/upload-artifact@v7
        with:
          name: qkd-analysis-and-submission
          if-no-files-found: error
          path: |
            submission/
            data/processed/
            figures/
            results/

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed figures results report/report.pdf submission
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate QKD analysis results and report [skip ci]"
            git push
          fi
